<section class="projects-section" style="background-color: transparent;">
  <div class="project-container">
    {% for project in site.data.settings.projects %}
      <a href="{{ site.github.url }}/projects/{{ project.url }}">
        <div class="project-unit"
     data-folder="{{ site.github.url }}/projects/{{ project.url }}"
     style="background-color: #EE2E24; background-image: url('{{ '/assets/img/projects/' | append: project.url | append: '/thumbnail.jpg' | relative_url }}')">
          <div class="project-overlay">
            <strong style="color: #ffffff;">
              {{ project.name }}
              <i class="fa fa-arrow-right" aria-hidden="true"></i>
            </strong>
          </div>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
